[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccf-aiops-2026"
version = "0.1.0"
description = "Shared CSV parsing and official evaluation tools for CCF AIOps 2026"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["aiops_common*", "aiops_challenge_2026*"]

[tool.setuptools.package-data]
"aiops_challenge_2026.config" = ["*.json"]
