[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccf-aiops-v3"
version = "0.1.0"
description = "Mac-first deterministic CCF AIOps pipeline with optional server LLM diagnosis"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["aiops_v3*", "data_side*"]

[tool.setuptools.package-data]
"aiops_v3" = ["config/*.json"]
